name: chiguire-dev

# Only PowerSync runs in Docker.
# Postgres runs natively on localhost:5432 (your local install).
#
# IMPORTANT: your local Postgres must have wal_level=logical.
# Run once: ALTER SYSTEM SET wal_level = logical; then restart Postgres.
# Verify: SHOW wal_level;

services:
  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../powersync/config.yaml:/config/config.yaml:ro
    environment:
      POWERSYNC_CONFIG_PATH: /config/config.yaml
      # Connects to host Postgres from inside the container
      POSTGRES_URI: postgresql://postgres:1234@host.docker.internal:5432/chiguire
      POWERSYNC_JWT_SECRET: ${POWERSYNC_JWT_SECRET:-change_me_in_production}
    extra_hosts:
      - "host.docker.internal:host-gateway"
