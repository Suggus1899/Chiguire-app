name: chiguire-dev

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chiguire
      POSTGRES_PASSWORD: chiguire_dev
      POSTGRES_DB: chiguire
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=10
        -c max_wal_senders=10
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiguire"]
      interval: 5s
      timeout: 5s
      retries: 5

  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../powersync/config.yaml:/config/config.yaml:ro
    environment:
      POWERSYNC_CONFIG_PATH: /config/config.yaml
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
